<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMPEST V110 CLOUD</title>
<style>body{background:#080808;color:#FFD700;font-family:system-ui;text-align:center;padding:18px} .card{background:#111;border:1px solid #FFD70033;border-radius:22px;padding:18px;margin:14px 0} .big{font-size:44px;font-weight:900} .btn{padding:15px 30px;border-radius:30px;border:none;font-weight:900;cursor:pointer} .on{background:#FFD700;color:#000} .off{background:#333;color:#fff} .trade{text-align:left;font-size:12px;padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between}</style>
</head><body>
<h2>🔥 TEMPEST V110 CLOUD</h2>
<div class="card"><div>🟢 LIVE - Trades even when phone OFF</div><div class="big" id="bal">$10,000.00</div><div id="prof">Loading...</div><br><button class="btn on" id="tog" onclick="toggle()">CLOUD AUTO: ON</button></div>
<div class="card"><div id="list">Loading cloud...</div></div>
<script>
async function load(){let r=await fetch('/api/status');let s=await r.json();document.getElementById('bal').innerText='$'+s.balance.toFixed(2);document.getElementById('prof').innerText='Profit: $'+s.profit.toFixed(2);document.getElementById('tog').innerText=s.isAuto?'☁️ CLOUD AUTO: ON':'💤 OFF';document.getElementById('tog').className='btn '+(s.isAuto?'on':'off');let h='';s.trades.forEach(t=>{h+=`<div class=trade><span>${t.t} ${t.sig} @ ${t.price}</span><b style=color:${t.p>0?'#0f0':'#f44'}>${t.p>0?'+':''}$${t.p}</b></div>`});document.getElementById('list').innerHTML=h||'Waiting for cloud cron...';}
async function toggle(){await fetch('/api/toggle');load();} setInterval(load,3000);load();
</script></body></html>
