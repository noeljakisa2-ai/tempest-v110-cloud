<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMPEST V110 CLOUD</title>
<style>
body{background:#0a0a0a;color:#FFD700;font-family:Arial;margin:0;padding:12px}
.card{background:#1a1a1a;border:2px solid #FFD700;border-radius:15px;padding:15px;margin:12px 0;text-align:center}
.btn{padding:14px;border:none;border-radius:25px;font-weight:bold;margin:6px;cursor:pointer;width:95%;font-size:16px}
.btn-on{background:#FFD700;color:#000}
.btn-off{background:#222;color:#FFD700;border:1px solid #FFD700}
.input{background:#222;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;margin:6px;width:88%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:#00ff88;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold}
.stat{font-size:12px;color:#999;margin:4px}
h1,h3{color:#FFD700;text-align:center}
</style>
</head>
<body>
<h1>🔥 TEMPEST V110 CLOUD</h1>

<div class="card">
<span class="badge">● LIVE CLOUD</span><br><br>
Trades even when phone OFF<br>
<h1 id="balance" style="font-size:38px;margin:12px 0">$10,000.00</h1>
<div class="stat" id="balStatus">DEMO - Add DERIV_TOKEN in Vercel</div>
<button class="btn btn-on" id="toggleBtn" onclick="toggleBot()">CLOUD AUTO: ON</button>
</div>

<div class="card">
<h3>⚙️ BOT CONTROLS</h3>
<div class="grid">
<button class="btn btn-on" onclick="startBot()">▶ START</button>
<button class="btn btn-off" onclick="stopBot()">⏹ STOP</button>
</div>
<input id="stake" class="input" type="number" value="1" placeholder="Stake $">
<input id="martingale" class="input" type="number" value="2.1" step="0.1" placeholder="Martingale">
<input id="tp" class="input" type="number" value="50" placeholder="Take Profit">
<input id="sl" class="input" type="number" value="100" placeholder="Stop Loss">
<select id="pair" class="input">
<option value="R_100">Volatility 100</option>
<option value="R_75">Volatility 75</option>
<option value="R_50">Volatility 50</option>
<option value="R_25">Volatility 25</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
</select>
</div>

<div class="card">
<h3>📊 LIVE STATS</h3>
<div class="grid">
<div>Profit: <b id="profit">$0.00</b></div>
<div>Trades: <b id="trades">0</b></div>
<div>Wins: <b id="wins" style="color:#0f0">0</b></div>
<div>Losses: <b id="losses" style="color:#f00">0</b></div>
</div>
<div class="stat" id="lastTrade">Last: Waiting...</div>
<div class="stat" id="cloudStatus">Cloud: Connecting...</div>
</div>

<div class="card">
<h3>📜 HISTORY</h3>
<div id="history" style="text-align:left;font-size:13px;max-height:250px;overflow:auto;background:#000;padding:8px;border-radius:8px">No trades yet</div>
</div>

<script>
let botOn=true;
async function fetchStatus(){
 try{
  let r=await fetch('/api/status'); let j=await r.json();
  document.getElementById('balance').innerText='$'+(j.balance||10000).toFixed(2);
  document.getElementById('balStatus').innerText=j.accountType||'DEMO';
  document.getElementById('profit').innerText='$'+(j.profit||0).toFixed(2);
  document.getElementById('trades').innerText=j.trades||0;
  document.getElementById('wins').innerText=j.wins||0;
  document.getElementById('losses').innerText=j.losses||0;
  document.getElementById('lastTrade').innerText='Last: '+(j.last||'Waiting');
  document.getElementById('cloudStatus').innerText='Cloud: '+(j.cloud||'Online ✅');
  botOn=j.enabled!==false;
  document.getElementById('toggleBtn').innerText='CLOUD AUTO: '+(botOn?'ON':'OFF');
  if(j.history&&j.history.length) document.getElementById('history').innerHTML=j.history.slice(-15).reverse().map(t=>`<div>⏰ ${t.time} | ${t.pair} | ${t.result} | $${t.profit}</div>`).join('');
 }catch(e){document.getElementById('cloudStatus').innerText='Cloud: Add DERIV_TOKEN in Vercel Settings';}
}
async function toggleBot(){botOn=!botOn;await fetch('/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:botOn})});fetchStatus();}
async function startBot(){await fetch('/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:true,stake:stake.value,pair:pair.value})});alert('Bot STARTED ✅');}
async function stopBot(){await fetch('/api/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:false})});alert('Bot STOPPED ⏹');}
setInterval(fetchStatus,3000); fetchStatus();
</script>
</body>
  </html>
